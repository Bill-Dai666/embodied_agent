<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Avatar Chatbot</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img src="static/nyu-logo.svg" alt="NYU" class="logo" />
      
    </div>
  </header>
    <h2>Talk with your AI chatbot</h2>

    <!-- Chat history display -->
    <div id="chat-history" style="border: 1px solid #ddd; padding: 10px; height: 300px; overflow-y: auto;"></div>

    <!-- User input field -->
    <input type="text" id="userInput" placeholder="Type any question you have" style="width: 80%; padding: 10px;"/>
    <button onclick="sendMessage()" style="padding: 10px;">send</button>

    <script>
        // URL 参数抓取和存储
        const urlParams = new URLSearchParams(window.location.search);
        let articleId = urlParams.get('article_id') || '';
        let responseId = urlParams.get('response_id') || '';

        // 存储到 sessionStorage 以便在整个会话中保持
        if (articleId) {
            sessionStorage.setItem('article_id', articleId);
            console.log('📄 抓取到 article_id:', articleId);
        } else {
            // 尝试从 sessionStorage 获取
            const storedArticleId = sessionStorage.getItem('article_id');
            if (storedArticleId) {
                articleId = storedArticleId;
                console.log('📄 从 sessionStorage 获取 article_id:', articleId);
            }
        }

        if (responseId) {
            sessionStorage.setItem('response_id', responseId);
            console.log('🆔 抓取到 response_id:', responseId);
        } else {
            // 尝试从 sessionStorage 获取
            const storedResponseId = sessionStorage.getItem('response_id');
            if (storedResponseId) {
                responseId = storedResponseId;
                console.log('🆔 从 sessionStorage 获取 response_id:', responseId);
            }
        }

        // 显示当前参数状态（可选，用于调试）
        if (articleId || responseId) {
            console.log('🔗 当前页面参数状态:');
            console.log('  article_id:', articleId || '(未设置)');
            console.log('  response_id:', responseId || '(未设置)');
        }

        // Generate a unique session_id for each user session
        let session_id = "session_" + Math.random().toString(36).substr(2, 9);

        // Send message to backend (Intermediary API)
        async function sendMessage(initial = false) {
            const inputElem = document.getElementById("userInput");
            const userMessage = initial ? "" : inputElem.value;
            if (!initial && !userMessage) return;

            const chatHistory = document.getElementById("chat-history");
            if (!initial) {
                chatHistory.innerHTML += `<p><strong>You：</strong>${userMessage}</p>`;
            }

            // 构建请求体，包含 URL 参数
            const requestBody = {
                session_id: session_id,
                user_message: userMessage
            };

            // 添加 URL 参数到请求体
            if (articleId) {
                requestBody.article_id = articleId;
            }
            if (responseId) {
                requestBody.response_id = responseId;
            }

            console.log('📤 发送请求体:', requestBody);

            const baseUrl = window.location.pathname.startsWith("/chat_based")
            ? "/chat_based"
            : "";

            const response = await fetch(`${baseUrl}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            chatHistory.innerHTML += `<p><strong>Chatbot：</strong>${data?.chatgpt_text || "something wrong"}</p>`;

            if (data.avatar_audio_url) {
                const audio = new Audio(data.avatar_audio_url);
                audio.play();
            }

            chatHistory.scrollTop = chatHistory.scrollHeight;
            inputElem.value = '';
        }

        // initialize welcoming message
        window.onload = () => {
            sendMessage(true);
        };
    </script>
       

  <footer class="footnote">© 2025 NYU · Internal demo. All rights reserved.</footer>
</body>
</html>
